# luna_pinyin.custom.yaml
# encoding: utf-8

patch:
  __include: ff14_magic.custom:/patch
  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 西文 ]
    - name: full_shape
      reset: 0
      states: [ 半角, 全角 ]
    - options: [ zh_hant, zh_hans, zh_hant_hk, zh_hant_tw ]
      reset: 1
      states: [ 傳統漢字, 简化字, 香港字形, 臺灣字形 ]
      abbrev: [ 漢, 简, 港, 臺 ]
    - name: ascii_punct
      reset: 0
      states: [ 。，, ．， ]

  translator/dictionary: luna_pinyin

  # 載入自訂短語
  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 1
