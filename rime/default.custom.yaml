# Rime default settings
# encoding: utf-8

patch:
  schema_list:
    - schema: luna_pinyin
    - schema: luna_pinyin_simp
    - schema: luna_pinyin_fluency
    - schema: bopomofo
    - schema: bopomofo_tw
    - schema: cangjie5
    - schema: stroke
    - schema: terra_pinyin

  # 候選詞數量（預設 5 有點少）
  menu/page_size: 9

  # Shift 直接上屏原始輸入並切換到西文
  ascii_composer:
    switch_key:
      Shift_L: commit_text
      Shift_R: commit_text

  switcher:
    hotkeys:
      - Control+grave
      - Control+Shift+grave
      - F4
