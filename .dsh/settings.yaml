ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: poke
  model: deepseek-v4-pro
  reasoningEffort: max
permission:
  defaultPreset: danger-full-access
agent-presets:
  default: minimal-nixos
llm-pi-ai:
  providers:
    openai:
      models:
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
          contextWindow: 272000
          maxTokens: 128000
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
          contextWindow: 272000
          maxTokens: 128000
      baseURL: https://dm-fox.rjj.cc/codex/v1
    kimi-coding:
      models:
        - id: k3
          name: Kimi K3
          contextWindow: 1048576
          maxTokens: 131072
        - id: k3-256k
          name: Kimi K3-256K
          contextWindow: 262144
          maxTokens: 131072
        - id: kimi-for-coding
          name: Kimi K2.7 Code
          contextWindow: 262144
          maxTokens: 32768
        - id: kimi-for-coding-highspeed
          name: Kimi For Coding HighSpeed
          contextWindow: 262144
          maxTokens: 32768
    opencode-go:
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
    poke:
      apiKeyEnv: POKE_API_KEY
      api: openai-responses
      baseURL: https://www.poke2api.com
      models:
        - id: deepseek-v4-flash
          name: poke/deepseek-v4-flash
          contextWindow: 1000000
          maxTokens: 2048000
          reasoningEfforts:
            off: null
            low: low
            high: high
            max: max
        - id: deepseek-v4-pro
          name: poke/deepseek-v4-pro
          contextWindow: 1000000
          maxTokens: 2048000
          reasoningEfforts:
            off: null
            low: low
            high: high
            max: max
locale:
  preference: zh
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
